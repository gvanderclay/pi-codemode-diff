name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyte
      # The PTY verifier itself needs a Pi install and the permission package;
      # CI only checks that its screen predicates ignore cleared frames.
      - run: python test/pty/preapproval_tui.py --self-test
